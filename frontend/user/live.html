<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitor - Road Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .alert-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .alert-banner.active {
            opacity: 1;
        }

        .alert-critical {
            background-color: rgba(239, 68, 68, 0.9);
            color: white;
            border: 2px solid #f87171;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.9; transform: translateX(-50%) scale(1.05); }
        }
    </style>
</head>

<body class="bg-slate-900 min-h-screen text-slate-100">

    <div class="flex">
        <!-- Sidebar -->
        <aside class="sidebar w-64 min-h-screen p-4 fixed left-0 top-0 bg-slate-800 border-r border-slate-700">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-white">Road Monitor</h2>
                    <p class="text-xs text-slate-400">User Portal</p>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="live.html" class="sidebar-link active flex items-center gap-3 px-3 py-2 rounded-lg bg-indigo-600/10 text-indigo-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span>Live Monitor</span>
                </a>
                <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span>Dashboard</span>
                </a>
                 <a href="hazard_map.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <span>Hazard Map</span>
                </a>
                <a href="vehicles.html" class="sidebar-link flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 text-slate-400 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                    </svg>
                    <span>My Vehicles</span>
                </a>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>Config</span>
                </a>
               
            </nav>

             <div class="absolute bottom-4 left-4 right-4">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition-colors border border-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="ml-64 flex-1 p-8">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-bold text-white">Live ADAS Feed</h1>
                    <p class="text-slate-400">Real-time road monitoring and alerts</p>
                </div>
                <div class="flex items-center gap-4">
                    <div id="status-indicator" class="flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 text-green-400 border border-green-500/30">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span class="text-sm font-medium">System Active</span>
                    </div>
                </div>
            </header>

            <div class="max-w-6xl mx-auto">
                <!-- Video Feed -->
                <div class="video-container mb-6">
                    <div id="alert-banner" class="alert-banner alert-critical">
                        OVERSPEED DETECTED
                    </div>
                    <img id="video-stream" src="/video_feed" alt="Live Video Feed" class="video-feed">
                    
                    <!-- Stats Overlay -->
                    <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/90 to-transparent">
                        <div class="flex items-end justify-between">
                            <div class="flex gap-8">
                                <div>
                                    <p class="text-slate-400 text-sm mb-1">Current Speed</p>
                                    <p class="text-4xl font-bold font-mono"><span id="speed-val">0</span> <span class="text-lg text-slate-400">km/h</span></p>
                                </div>
                                <div>
                                    <p class="text-slate-400 text-sm mb-1">Limit</p>
                                    <div class="w-16 h-16 rounded-full border-4 border-red-500 bg-white flex items-center justify-center">
                                        <span id="limit-val" class="text-2xl font-bold text-black">50</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex gap-2">
                                <button onclick="toggleStream()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition-colors">
                                    Pause Stream
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Alerts -->
                <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
                    <h3 class="text-lg font-bold text-white mb-4">Recent Alerts</h3>
                    <div id="alerts-list" class="space-y-3">
                        <p class="text-slate-500 text-sm">No recent alerts.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // Check auth
        if (!localStorage.getItem('token')) {
            window.location.href = '../index.html';
        }

        const videoImg = document.getElementById('video-stream');
        const speedVal = document.getElementById('speed-val');
        const limitVal = document.getElementById('limit-val');
        const alertBanner = document.getElementById('alert-banner');
        
        let isStreaming = true;

        function toggleStream() {
            isStreaming = !isStreaming;
            if (isStreaming) {
                videoImg.src = "/video_feed?t=" + new Date().getTime();
            } else {
                videoImg.src = "";
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '../index.html';
        }

        // Poll for stats
        setInterval(async () => {
            if (!isStreaming) return;
            
            try {
                const res = await fetch('/api/monitor/status', {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const data = await res.json();
                
                if (data.active) {
                    speedVal.textContent = data.speed.toFixed(1);
                    limitVal.textContent = data.limit;
                    
                    // Show alert banner
                    if (data.alerts && data.alerts.length > 0) {
                        alertBanner.textContent = data.alerts[0];
                        alertBanner.classList.add('active');
                    } else {
                        alertBanner.classList.remove('active');
                    }
                }
            } catch (e) {
                console.error("Stats poll error", e);
            }
        }, 500);
    </script>
</body>
</html>
