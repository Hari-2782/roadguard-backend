<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothole Map - Road Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .timeline-container {
            position: relative;
            height: 100px;
            background: #1e293b;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            overflow-x: auto;
            padding: 0 20px;
        }
        .timeline-line {
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 4px;
            background: #475569;
            transform: translateY(-50%);
        }
        .timeline-marker {
            position: absolute;
            top: 50%;
            width: 16px;
            height: 16px;
            background: #f59e0b; /* Amber for pothole */
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .timeline-marker:hover {
            transform: translate(-50%, -50%) scale(1.5);
            z-index: 10;
        }
        .timeline-marker.sign-21 {
            background: #3b82f6; /* Blue for signs */
            border-radius: 0;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%) rotate(45deg);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-200">

<div class="flex">
    <!-- Sidebar (Same as dashboard) -->
    <aside class="sidebar w-64 min-h-screen p-4 fixed left-0 top-0 bg-slate-800">
        <div class="flex items-center gap-3 mb-8 px-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                 <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </div>
            <div>
                <h2 class="font-bold text-white">Road Monitor</h2>
                <p class="text-xs text-slate-400">User Portal</p>
            </div>
        </div>
        <nav class="space-y-1">
            <a href="dashboard.html" class="sidebar-link hover:bg-slate-700 p-2 rounded flex gap-2">
                <span>Dashboard</span>
            </a>
            <a href="vehicles.html" class="sidebar-link hover:bg-slate-700 p-2 rounded flex gap-2">
                <span>My Vehicles</span>
            </a>
            <a href="pothole_map.html" class="sidebar-link active bg-indigo-600 text-white p-2 rounded flex gap-2">
                <span>Pothole Map</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 flex-1 p-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold text-white mb-2">Road Condition Map</h1>
            <p class="text-slate-400 mb-6">Visualizing potholes and signs along your route.</p>

            <!-- Filters -->
            <div class="bg-slate-800 p-4 rounded-xl mb-6 flex gap-4">
                <select id="vehicleSelect" class="bg-slate-700 text-white p-2 rounded border border-slate-600">
                    <option value="">Select Vehicle...</option>
                </select>
                <button onclick="loadData()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Load Route</button>
            </div>

            <!-- Visualization -->
            <div class="bg-slate-800 p-6 rounded-xl mb-6">
                <h3 class="text-lg font-semibold text-white mb-4">Route Timeline (Simulated Map)</h3>
                <div class="timeline-container relative" id="timeline">
                    <div class="timeline-line"></div>
                    <!-- Markers injected here -->
                </div>
                <div class="flex gap-4 text-sm text-slate-400 mt-2">
                    <div class="flex items-center gap-2"><div class="w-3 h-3 bg-amber-500 rounded-full"></div> Pothole</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 bg-blue-500 transform rotate-45"></div> Road Sign</div>
                </div>
            </div>

            <!-- Detail View -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="detailSection" style="display:none;">
                <div class="bg-slate-800 p-6 rounded-xl">
                    <h3 class="text-lg font-semibold text-white mb-4">Event Details</h3>
                    <div id="eventDetails" class="text-slate-300">
                        Select a marker to view details.
                    </div>
                </div>
                <div class="bg-slate-800 p-6 rounded-xl">
                    <h3 class="text-lg font-semibold text-white mb-4">Evidence</h3>
                    <img id="evidenceImg" class="w-full rounded border border-slate-600 hidden" src="" alt="Evidence">
                    <p id="noEvidence" class="text-slate-500 italic">No image available</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../js/api.js"></script>
<script>
    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
        if (!requireAuth()) return;
        
        // Load user vehicles
        try {
            const vehicles = await API.getUserVehicles();
            const select = document.getElementById('vehicleSelect');
            vehicles.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id; // Use ID for API
                opt.textContent = `${v.label} (${v.vehicle_id})`;
                select.appendChild(opt);
            });
            
            if (vehicles.length > 0) {
                select.value = vehicles[0].id; // Use ID
                loadData();
            }
        } catch (e) {
            console.error(e);
        }
    });

    async function loadData() {
        const vid = document.getElementById('vehicleSelect').value;
        if (!vid) return;

        try {
            // Fetch events (pothole and sign 21)
            // Note: API.getVehicleEvents returns all types. We filter here.
            const events = await API.getVehicleEvents(vid, 500); // Get last 500 events
            renderTimeline(events);
        } catch (e) {
            console.error("Failed to load events", e);
        }
    }

    function renderTimeline(events) {
        const timeline = document.getElementById('timeline');
        // Clear old markers (keep line)
        timeline.innerHTML = '<div class="timeline-line"></div>';

        // Filter relevant events
        const mapEvents = events.filter(e => e.type === 'pothole' || e.type === 'sign_21');
        
        if (mapEvents.length === 0) return;

        // Sort by timestamp
        mapEvents.sort((a, b) => new Date(a.ts) - new Date(b.ts));
        
        const startTime = new Date(mapEvents[0].ts).getTime();
        const endTime = new Date(mapEvents[mapEvents.length - 1].ts).getTime();
        const duration = endTime - startTime || 1; // avoid div/0

        mapEvents.forEach(e => {
            const time = new Date(e.ts).getTime();
            const pct = ((time - startTime) / duration) * 90 + 5; // 5% to 95% padding

            const marker = document.createElement('div');
            marker.className = `timeline-marker ${e.type === 'sign_21' ? 'sign-21' : ''}`;
            marker.style.left = `${pct}%`;
            marker.title = `${e.type}: ${new Date(e.ts).toLocaleTimeString()}`;
            marker.onclick = () => showDetail(e);
            
            timeline.appendChild(marker);
        });
    }

    function showDetail(event) {
        const section = document.getElementById('detailSection');
        section.style.display = 'grid';
        
        const details = document.getElementById('eventDetails');
        details.innerHTML = `
            <p><strong>Type:</strong> ${event.type.toUpperCase()}</p>
            <p><strong>Time:</strong> ${new Date(event.ts).toLocaleString()}</p>
            <p><strong>Details:</strong> ${event.details || 'N/A'}</p>
            <p><strong>Value/Conf:</strong> ${event.value}</p>
        `;

        const img = document.getElementById('evidenceImg');
        const noImg = document.getElementById('noEvidence');
        
        if (event.image_path) {
            // Assuming image path is relative or needs /api/ prefix
            // In api.py: '/<path:path>' serves from 'frontend'. 
            // BUT images are in 'evidence' folder.
            // Wait, api.py does not expose evidence folder directly unless I add a route.
            // I should check api.py specifically for evidence serving.
            // For now, assume a path like '/evidence/filename' works if I add static serve.
            img.src = `../../evidence/${event.image_path.split('/').pop()}`; // Local dev path hack or api path
            img.classList.remove('hidden');
            noImg.classList.add('hidden');
        } else {
            img.classList.add('hidden');
            noImg.classList.remove('hidden');
        }
    }
</script>
</body>
</html>
