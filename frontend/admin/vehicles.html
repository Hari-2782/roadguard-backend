<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicles - Admin - RoadGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/theme.js"></script>
</head>

<body class="bg-slate-900 min-h-screen">

    <div class="flex">
        <!-- Admin Sidebar -->
        <aside class="sidebar w-64 min-h-screen p-4 fixed left-0 top-0">
            <div class="flex items-center gap-3 mb-8 px-2">
                <div class="w-10 h-10 bg-rose-600 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h2 class="font-bold text-white">RoadGuard</h2>
                    <p class="text-xs text-rose-400">Admin Portal</p>
                </div>
            </div>

            <nav class="space-y-1">
                <a href="dashboard.html" class="sidebar-link">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                        </path>
                    </svg>
                    <span>Dashboard</span>
                </a>
                <a href="users.html" class="sidebar-link">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                        </path>
                    </svg>
                    <span>Users</span>
                </a>
                <a href="vehicles.html" class="sidebar-link active">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <span>Vehicles</span>
                </a>
                <a href="calibration.html" class="sidebar-link">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span>Calibration</span>
                </a>
            </nav>

            <div class="absolute bottom-4 left-4 right-4">
                <button onclick="API.logout()" class="w-full btn btn-secondary text-sm">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="ml-64 flex-1 p-6">
            <div class="max-w-6xl mx-auto">
                <div class="mb-8 flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold text-white">All Vehicles</h1>
                        <p class="text-slate-400 mt-1">Manage all registered vehicles</p>
                    </div>
                    <button onclick="openAddModal()" class="btn btn-primary">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4">
                            </path>
                        </svg>
                        Add Vehicle
                    </button>
                </div>

                <div class="glass-card rounded-2xl overflow-hidden">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Vehicle ID</th>
                                <th>Owner</th>
                                <th>Label</th>
                                <th>Speed Limit</th>
                                <th>Calibration</th>
                                <th>Events</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="vehiclesTable">
                            <tr>
                                <td colspan="7" class="text-center text-slate-400 py-8">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="vehicleModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="text-lg font-semibold text-white mb-4" id="modalTitle">Add Vehicle</h3>
            <form id="vehicleForm" class="space-y-4">
                <input type="hidden" id="vehicleDbId">
                <div>
                    <label class="form-label">Vehicle ID *</label>
                    <input type="text" id="inputVehicleId" class="form-input" placeholder="BUS_01" required>
                </div>
                <div>
                    <label class="form-label">Owner</label>
                    <select id="inputOwner" class="form-input">
                        <option value="">-- No Owner --</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Label</label>
                    <input type="text" id="inputLabel" class="form-input" placeholder="School Van">
                </div>
                <div>
                    <label class="form-label">Speed Limit (km/h)</label>
                    <input type="number" id="inputSpeed" class="form-input" placeholder="60" min="10" max="200">
                </div>
                <div>
                    <label class="form-label">kmh_per_pixel (Calibration)</label>
                    <input type="number" id="inputCalib" class="form-input" step="0.000001" placeholder="38.589">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="Modal.close('vehicleModal')"
                        class="btn btn-secondary flex-1">Cancel</button>
                    <button type="submit" class="btn btn-primary flex-1">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        if (!requireAuth('admin')) { }

        let vehicles = [];
        let users = [];

        loadData();

        async function loadData() {
            try {
                [vehicles, users] = await Promise.all([
                    API.getAdminVehicles(),
                    API.getAdminUsers()
                ]);

                // Populate owner dropdown
                const select = document.getElementById('inputOwner');
                select.innerHTML = '<option value="">-- No Owner --</option>' +
                    users.filter(u => u.role === 'user').map(u =>
                        `<option value="${u.id}">${escapeHtml(u.name || u.email)}</option>`
                    ).join('');

                renderTable();
            } catch (err) {
                Toast.error('Failed to load data');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('vehiclesTable');

            if (vehicles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-slate-400 py-8">No vehicles</td></tr>`;
                return;
            }

            tbody.innerHTML = vehicles.map(v => `
        <tr>
          <td><a href="vehicle-detail.html?id=${v.id}" class="text-indigo-400 font-medium hover:underline cursor-pointer">${escapeHtml(v.vehicle_id)}</a></td>
          <td class="text-slate-300">${escapeHtml(v.owner_name || v.owner_email || '-')}</td>
          <td class="text-slate-300">${escapeHtml(v.label || '-')}</td>
          <td class="text-slate-300">${v.speed_limit_kmh ? v.speed_limit_kmh + ' km/h' : '-'}</td>
          <td>
            ${v.kmh_per_pixel ?
                    `<span class="badge badge-success">${v.kmh_per_pixel.toFixed(3)}</span>` :
                    `<span class="badge badge-warning">Not set</span>`}
          </td>
          <td><a href="vehicle-detail.html?id=${v.id}" class="text-indigo-400 hover:underline cursor-pointer">${v.total_events || 0}</a></td>
          <td>
            <div class="flex gap-2">
              <button onclick="openEditModal(${v.id})" class="btn btn-icon btn-secondary" title="Edit">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
              </button>
              <a href="calibration.html?vehicle=${v.id}" class="btn btn-icon btn-secondary text-emerald-400" title="Calibrate">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35"></path>
                </svg>
              </a>
              <button onclick="deleteVehicle(${v.id})" class="btn btn-icon btn-secondary text-rose-400 hover:bg-rose-500/20" title="Delete">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Vehicle';
            document.getElementById('vehicleDbId').value = '';
            document.getElementById('inputVehicleId').value = '';
            document.getElementById('inputVehicleId').disabled = false;
            document.getElementById('inputOwner').value = '';
            document.getElementById('inputLabel').value = '';
            document.getElementById('inputSpeed').value = '';
            document.getElementById('inputCalib').value = '';
            Modal.open('vehicleModal');
        }

        function openEditModal(id) {
            const v = vehicles.find(x => x.id === id);
            if (!v) return;

            document.getElementById('modalTitle').textContent = 'Edit Vehicle';
            document.getElementById('vehicleDbId').value = id;
            document.getElementById('inputVehicleId').value = v.vehicle_id;
            document.getElementById('inputVehicleId').disabled = true;
            document.getElementById('inputOwner').value = v.owner_id || '';
            document.getElementById('inputLabel').value = v.label || '';
            document.getElementById('inputSpeed').value = v.speed_limit_kmh || '';
            document.getElementById('inputCalib').value = v.kmh_per_pixel || '';
            Modal.open('vehicleModal');
        }

        document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('vehicleDbId').value;
            const data = {
                vehicle_id: document.getElementById('inputVehicleId').value.trim(),
                owner_id: document.getElementById('inputOwner').value || null,
                label: document.getElementById('inputLabel').value.trim(),
                speed_limit_kmh: document.getElementById('inputSpeed').value || null,
                kmh_per_pixel: document.getElementById('inputCalib').value || null
            };

            try {
                if (id) {
                    await API.updateAdminVehicle(id, data);
                    Toast.success('Vehicle updated');
                } else {
                    const result = await API.addAdminVehicle(data);
                    if (result.error) {
                        Toast.error(result.error);
                        return;
                    }
                    Toast.success('Vehicle added');
                }
                Modal.close('vehicleModal');
                loadData();
            } catch (err) {
                Toast.error('Failed to save');
            }
        });

        async function deleteVehicle(id) {
            const confirmed = await Modal.confirm('Delete this vehicle?', 'Delete Vehicle');
            if (!confirmed) return;

            try {
                await API.deleteAdminVehicle(id);
                Toast.success('Vehicle deleted');
                loadData();
            } catch (err) {
                Toast.error('Failed to delete');
            }
        }
    </script>
</body>

</html>
